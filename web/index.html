<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Terminal Quest — CLI Learner</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TermQuest" />
  <script type="importmap">
    { "imports": { "three": "./js/vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <header id="topbar">
    <div id="topbar-left">
      <button id="map-toggle" title="Realm map">🗺</button>
      <div id="logo">⚔️ TERMINAL QUEST</div>
    </div>
    <div id="hud">
      <span id="hud-level">Lv 1 · Shell Novice</span>
      <div id="hud-bar"><div id="hud-bar-fill"></div></div>
      <span id="hud-xp">0 XP</span>
      <span id="save-dot" title="Auto-saved">💾</span>
      <button id="lang-btn" title="ภาษาไทย / English">ไทย</button>
      <button id="codex-btn" title="Codex: spellbook &amp; achievements">📖</button>
      <button id="sfx-btn" title="Sound on/off">🔊</button>
      <button id="save-btn" title="Save &amp; Load menu">💾</button>
      <input id="import-file" type="file" accept=".json,application/json" hidden />
      <button id="reset-btn" title="Reset progress">↺</button>
    </div>
  </header>

  <div id="codex-overlay" hidden></div>
  <div id="save-overlay" hidden></div>

  <main id="layout">
    <aside id="sidebar">
      <div id="sidebar-title">REALM MAP</div>
      <div id="quest-nav"></div>
    </aside>

    <section id="layout-main">
      <div id="stage"></div>
      <div id="stage-resize" title="Drag to resize the stage and terminal"></div>
      <div id="terminal">
        <div id="term-output"></div>
        <div id="term-input-row">
          <span id="term-prompt">hero@sanctum:~$</span>
          <input id="term-input" type="text" autocomplete="off" spellcheck="false" autofocus />
        </div>
      </div>
    </section>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/lang_th.js"></script>
  <script src="js/lang_th_realms_a.js"></script>
  <script src="js/lang_th_realms_b.js"></script>
  <script src="js/lang_th_realms_c.js"></script>
  <script src="js/lang_th_void.js"></script>
  <script src="js/vfs.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/git.js"></script>
  <script src="js/docker.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/gear.js"></script>
  <script src="js/fxmap.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/content_bash.js"></script>
  <script src="js/content_net.js"></script>
  <script src="js/content_cloud.js"></script>
  <script src="js/content_git.js"></script>
  <script src="js/content_docker.js"></script>
  <script src="js/content_ops.js"></script>
  <script src="js/content_final.js"></script>
  <script src="js/content_void.js"></script>
  <script type="module" src="js/stage3d/stage3d.js"></script>
  <script src="js/ui_resize.js"></script>
  <script src="js/main.js"></script>
  <!-- PWA: adding a file? Also update sw.js ASSETS and bump its CACHE version. -->
  <script>
    if ('serviceWorker' in navigator) {
      // undefined under file:// (the iOS WKWebView wrapper), so this safely no-ops there
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
